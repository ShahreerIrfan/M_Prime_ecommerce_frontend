name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: https://menprimestore.com/wp-json

      # Deploy using SFTP (SSH Port 22 - Safe & Fast)
      - name: Deploy to cPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          ssh_private_key: ''
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local_path: './*'
          remote_path: '/home/menprime/frontend'
          args: '-o StrictHostKeyChecking=no'
