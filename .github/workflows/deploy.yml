name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main # Trigger deployment on pushes to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies & Build Next.js
      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build

      # Step 4: Deploy to cPanel via FTP / SFTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: /frontend/ # Target folder on cPanel
          local-dir: ./frontend/ # Local directory to upload
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
